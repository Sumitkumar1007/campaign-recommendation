[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campaign-recommendation"
version = "0.1.0"
description = "Production-grade baseline for EMI campaign recommendation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "catboost>=1.2,<2",
  "mlflow>=2.12,<3",
  "psycopg[binary]>=3.2,<4",
  "paramiko>=3.4,<4",
  "gunicorn>=22,<24"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
campaign-recommendation = "campaign_recommendation.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
